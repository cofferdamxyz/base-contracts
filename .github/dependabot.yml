# Dependabot for base-contracts (joint 2 of the agentic loop; workspace
# docs/runbooks/agentic-loop-completion.md §7). Layer 0 of the security lane: GitHub opens the
# pull requests it can, CI runs on each, Lockkeeper indexes them, the founder lands them. Security
# updates are switched on per repository in Settings; this file groups them and adds weekly,
# grouped version updates after a seven-day cooldown, so a release has a week in the open before
# it is proposed here. A Dependabot commit carries no sign-off: the founder lands it with
# `git cherry-pick -s`, not by fast-forward.
version: 2
# The private enterprise submodule (contracts/enterprise) is pinned by hand; no gitsubmodule
# ecosystem here.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Majors that are migrations, not bumps, and would reopen every week: Hardhat 3 is ESM-only
    # (compile fails without "type": "module" and every plugin moves with it); TypeScript 7 breaks
    # ts-node 10, which Hardhat 2 loads for the config and the tests; @noble/curves 2 changes the
    # signing API and every Cofferdam repository is on 1.x. Each is a session's own change, with
    # a workspace decision for Hardhat. Security updates still open for them (ignore applies to
    # version updates only when update-types is set).
    ignore:
      - dependency-name: "hardhat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@noble/curves"
        update-types: ["version-update:semver-major"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      hardhat:
        applies-to: version-updates
        patterns: ["hardhat", "hardhat-*", "@nomicfoundation/*", "@typechain/*", "typechain"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
